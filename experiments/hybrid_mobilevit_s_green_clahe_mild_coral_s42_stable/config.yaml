experiment:
  name: hybrid_mobilevit_s_green_clahe_mild_coral_s42
  description: "MobileViT-S green_clahe \xD7 mild_aware_coral seed 42"
  seed: 42
data:
  datasets_root: datasets
  aptos:
    root: archive
    train_csv: train_1.csv
    val_csv: valid.csv
    test_csv: test.csv
    train_images: train_images/train_images
    val_images: val_images/val_images
    test_images: test_images/test_images
  idrid:
    root: idrid/B. Disease Grading
    train_csv: 2. Groundtruths/a. IDRiD_Disease Grading_Training Labels.csv
    test_csv: 2. Groundtruths/b. IDRiD_Disease Grading_Testing Labels.csv
    train_images: 1. Original Images/a. Training Set
    test_images: 1. Original Images/b. Testing Set
  messidor2:
    root: '../Messidor '
    labels_csv: messidor_data.csv
    images_dir: IMAGES
  deepdrid:
    root: DeepDRiD
  num_classes: 5
  class_names:
  - 0
  - 1
  - 2
  - 3
  - 4
train:
  train_dataset: aptos
  epochs: 20
  batch_size: 1
  num_workers: 0
  optimizer: adamw
  learning_rate: 0.0001
  weight_decay: 0.0001
  scheduler: cosine
  amp: false
  selection_metric: quadratic_weighted_kappa
  device: cpu
  interrupt_every: 40
preprocessing:
  name: green_clahe
  image_size: 224
  cache_root: datasets/cache
  clahe_clip_limit: 2.0
  clahe_tile_grid_size:
  - 8
  - 8
model:
  name: mobilevit_s
  source: timm
  pretrained: true
  head: coral
  num_classes: 5
loss:
  name: mild_aware_coral
  mild_sample_weight: 2.0
  threshold_weights:
  - 2.0
  - 2.0
  - 1.0
  - 1.0
