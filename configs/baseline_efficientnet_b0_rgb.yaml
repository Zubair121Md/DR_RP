# Experiment 1 — APTOS EfficientNet-B0 RGB baseline
# Train on APTOS only; validate on APTOS val; evaluate on APTOS test + IDRiD external.
# IDRiD is never used for training or model selection.

experiment:
  name: baseline_efficientnet_b0_rgb
  description: >
    Simple EfficientNet-B0 RGB baseline trained on APTOS and evaluated
    on APTOS and IDRiD for cross-dataset generalization.
  seed: 42
  # Per-run folders are created as results/<name>_<timestamp>/ etc. (no overwrite)

data:
  # Colab Drive datasets root (absolute). Local alternative: datasets
  datasets_root: "/content/drive/MyDrive/DR-Research/DATA SETS/datasets"
  aptos:
    root: archive
    train_csv: train_1.csv
    val_csv: valid.csv
    test_csv: test.csv
    train_images: train_images/train_images
    val_images: val_images/val_images
    test_images: test_images/test_images
  idrid:
    root: idrid/B. Disease Grading
    # External test only — both official IDRiD disease-grading splits
    train_csv: 2. Groundtruths/a. IDRiD_Disease Grading_Training Labels.csv
    test_csv: 2. Groundtruths/b. IDRiD_Disease Grading_Testing Labels.csv
    train_images: 1. Original Images/a. Training Set
    test_images: 1. Original Images/b. Testing Set
  num_classes: 5
  class_names: [0, 1, 2, 3, 4]

preprocessing:
  name: rgb                 # Experiment 1: RGB only (no Green+CLAHE)
  image_size: 224
  imagenet_mean: [0.485, 0.456, 0.406]
  imagenet_std: [0.229, 0.224, 0.225]
  train_augmentations:
    - resize_224
    - random_horizontal_flip_0.5
    - random_rotation_10
    - color_jitter_brightness_contrast_0.1
    - imagenet_normalize

model:
  name: efficientnet_b0     # Experiment 1 only
  source: torchvision
  pretrained: true          # ImageNet IMAGENET1K_V1
  num_classes: 5

loss:
  name: cross_entropy       # Experiment 1 only (no Focal / CORAL)

train:
  train_dataset: aptos      # NEVER idrid
  epochs: 20
  batch_size: 32            # Suitable for Tesla T4 @ 224
  num_workers: 2
  optimizer: adamw
  learning_rate: 1.0e-4
  weight_decay: 1.0e-4
  scheduler: cosine
  amp: true
  selection_metric: quadratic_weighted_kappa

evaluate:
  datasets:
    - name: aptos_test
      dataset: aptos
      split: test
    - name: idrid_external
      dataset: idrid
      split: all             # Unseen external pool (IDRiD train+test images)
  metrics:
    - accuracy
    - macro_f1
    - quadratic_weighted_kappa
    - mae
    - per_class_precision
    - per_class_recall
    - mild_dr_recall
    - confusion_matrix
    - confusion_0_1
    - confusion_1_2
