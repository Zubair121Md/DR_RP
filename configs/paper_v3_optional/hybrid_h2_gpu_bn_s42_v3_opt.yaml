experiment:
  name: hybrid_mobilevit_s_green_clahe_ce_gpu_bn_s42_v3_opt
  description: "Optional sensitivity: MobileViT-S H2 green_clahe \xD7 CE, seed 42,\
    \ device=mps, batch_size=16, freeze_bn=False (not in core v3 queue)."
  seed: 42
  protocol: frozen_protocol_v1
  cell: H2
  family: hybrid_gpu_bn
  group: optional_gpu_bn
  version: v3_opt
data:
  datasets_root: datasets
  aptos:
    root: archive
    train_csv: train_1.csv
    val_csv: valid.csv
    test_csv: test.csv
    train_images: train_images/train_images
    val_images: val_images/val_images
    test_images: test_images/test_images
  idrid:
    root: idrid/B. Disease Grading
    train_csv: 2. Groundtruths/a. IDRiD_Disease Grading_Training Labels.csv
    test_csv: 2. Groundtruths/b. IDRiD_Disease Grading_Testing Labels.csv
    train_images: 1. Original Images/a. Training Set
    test_images: 1. Original Images/b. Testing Set
  messidor2:
    root: '../Messidor '
    labels_csv: messidor_data.csv
    images_dir: IMAGES
  deepdrid:
    root: DeepDRiD
  num_classes: 5
  class_names:
  - 0
  - 1
  - 2
  - 3
  - 4
preprocessing:
  name: green_clahe
  image_size: 224
  cache_root: datasets/cache
  imagenet_mean:
  - 0.485
  - 0.456
  - 0.406
  imagenet_std:
  - 0.229
  - 0.224
  - 0.225
  clahe_clip_limit: 2.0
  clahe_tile_grid_size:
  - 8
  - 8
model:
  name: mobilevit_s
  source: timm
  pretrained: true
  head: ce
  num_classes: 5
loss:
  name: cross_entropy
train:
  train_dataset: aptos
  epochs: 20
  batch_size: 16
  num_workers: 0
  optimizer: adamw
  learning_rate: 0.0001
  weight_decay: 0.0001
  scheduler: cosine
  amp: false
  selection_metric: quadratic_weighted_kappa
  interrupt_every: 0
  device: mps
  freeze_bn: false
  max_steps_per_launch: 0
evaluate:
  datasets:
  - name: aptos_test
    dataset: aptos
    split: test
  - name: idrid_external
    dataset: idrid
    split: all
  - name: messidor2_external
    dataset: messidor2
    split: all
  - name: deepdrid_external
    dataset: deepdrid
    split: all
