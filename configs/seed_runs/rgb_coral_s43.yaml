experiment:
  name: baseline_efficientnet_b0_rgb_coral_s43
  description: "Completes the EfficientNet-B0 2\xD72 grid for the core research question:\
    \ retina-specific preprocessing \xD7 mild-stage-aware ordinal head, under fixed\
    \ training budget on MPS. Isolates CORAL vs CE on RGB (vs Exp1) and RGB vs Green+CLAHE\
    \ under CORAL (vs Exp3). Seed replicate s=43 for B0 2\xD72 (preprocess \xD7 ordinal\
    \ head)."
  seed: 43
data:
  datasets_root: datasets
  aptos:
    root: archive
    train_csv: train_1.csv
    val_csv: valid.csv
    test_csv: test.csv
    train_images: train_images/train_images
    val_images: val_images/val_images
    test_images: test_images/test_images
  idrid:
    root: idrid/B. Disease Grading
    train_csv: 2. Groundtruths/a. IDRiD_Disease Grading_Training Labels.csv
    test_csv: 2. Groundtruths/b. IDRiD_Disease Grading_Testing Labels.csv
    train_images: 1. Original Images/a. Training Set
    test_images: 1. Original Images/b. Testing Set
  num_classes: 5
  class_names:
  - 0
  - 1
  - 2
  - 3
  - 4
preprocessing:
  name: rgb
  image_size: 224
  cache_root: datasets/cache
  imagenet_mean:
  - 0.485
  - 0.456
  - 0.406
  imagenet_std:
  - 0.229
  - 0.224
  - 0.225
  train_augmentations:
  - resize_224
  - random_horizontal_flip_0.5
  - random_rotation_10
  - color_jitter_brightness_contrast_0.1
  - imagenet_normalize
model:
  name: efficientnet_b0
  source: torchvision
  pretrained: true
  head: coral
  num_classes: 5
loss:
  name: coral
train:
  train_dataset: aptos
  epochs: 20
  batch_size: 32
  num_workers: 0
  optimizer: adamw
  learning_rate: 0.0001
  weight_decay: 0.0001
  scheduler: cosine
  amp: false
  selection_metric: quadratic_weighted_kappa
evaluate:
  datasets:
  - name: aptos_test
    dataset: aptos
    split: test
  - name: idrid_external
    dataset: idrid
    split: all
  metrics:
  - accuracy
  - macro_f1
  - quadratic_weighted_kappa
  - mae
  - per_class_precision
  - per_class_recall
  - mild_dr_recall
  - confusion_matrix
  - confusion_0_1
  - confusion_1_2
  - ece
