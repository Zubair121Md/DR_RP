experiment:
  name: matched_efficientnet_b0_rgb_mild_aware_coral_s46_v2
  description: "Paper v2 matched B0 H3: EfficientNet-B0 rgb \xD7 mild_aware_coral\
    \ seed 46 (CPU bs=4 freeze_bn=True; archived B0 untouched)."
  seed: 46
  protocol: frozen_protocol_v1
  cell: H3
  family: matched_b0
  version: v2
data:
  datasets_root: datasets
  aptos:
    root: archive
    train_csv: train_1.csv
    val_csv: valid.csv
    test_csv: test.csv
    train_images: train_images/train_images
    val_images: val_images/val_images
    test_images: test_images/test_images
  idrid:
    root: idrid/B. Disease Grading
    train_csv: 2. Groundtruths/a. IDRiD_Disease Grading_Training Labels.csv
    test_csv: 2. Groundtruths/b. IDRiD_Disease Grading_Testing Labels.csv
    train_images: 1. Original Images/a. Training Set
    test_images: 1. Original Images/b. Testing Set
  messidor2:
    root: '../Messidor '
    labels_csv: messidor_data.csv
    images_dir: IMAGES
  deepdrid:
    root: DeepDRiD
  num_classes: 5
  class_names:
  - 0
  - 1
  - 2
  - 3
  - 4
preprocessing:
  name: rgb
  image_size: 224
  cache_root: datasets/cache
  imagenet_mean:
  - 0.485
  - 0.456
  - 0.406
  imagenet_std:
  - 0.229
  - 0.224
  - 0.225
model:
  name: efficientnet_b0
  source: torchvision
  pretrained: true
  head: coral
  num_classes: 5
loss:
  name: mild_aware_coral
  mild_sample_weight: 2.0
  threshold_weights:
  - 2.0
  - 2.0
  - 1.0
  - 1.0
train:
  train_dataset: aptos
  epochs: 20
  batch_size: 4
  num_workers: 0
  optimizer: adamw
  learning_rate: 0.0001
  weight_decay: 0.0001
  scheduler: cosine
  amp: false
  selection_metric: quadratic_weighted_kappa
  interrupt_every: 20
  device: cpu
  freeze_bn: true
  max_steps_per_launch: 60
evaluate:
  datasets:
  - name: aptos_test
    dataset: aptos
    split: test
  - name: idrid_external
    dataset: idrid
    split: all
  - name: messidor2_external
    dataset: messidor2
    split: all
  - name: deepdrid_external
    dataset: deepdrid
    split: all
