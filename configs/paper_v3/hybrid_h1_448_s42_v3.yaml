experiment:
  name: hybrid_mobilevit_s_rgb_cross_entropy_448_s42_v3
  description: "Paper v3 resolution H1: MobileViT-S rgb \xD7 cross_entropy at 448\xD7\
    448 seed 42 (no 224 cache; online resize)."
  seed: 42
  protocol: frozen_protocol_v1
  cell: H1
  family: hybrid_448
  group: res448
  version: v3
data:
  datasets_root: datasets
  aptos:
    root: archive
    train_csv: train_1.csv
    val_csv: valid.csv
    test_csv: test.csv
    train_images: train_images/train_images
    val_images: val_images/val_images
    test_images: test_images/test_images
  idrid:
    root: idrid/B. Disease Grading
    train_csv: 2. Groundtruths/a. IDRiD_Disease Grading_Training Labels.csv
    test_csv: 2. Groundtruths/b. IDRiD_Disease Grading_Testing Labels.csv
    train_images: 1. Original Images/a. Training Set
    test_images: 1. Original Images/b. Testing Set
  messidor2:
    root: '../Messidor '
    labels_csv: messidor_data.csv
    images_dir: IMAGES
  deepdrid:
    root: DeepDRiD
  num_classes: 5
  class_names:
  - 0
  - 1
  - 2
  - 3
  - 4
preprocessing:
  name: rgb
  image_size: 448
  imagenet_mean:
  - 0.485
  - 0.456
  - 0.406
  imagenet_std:
  - 0.229
  - 0.224
  - 0.225
model:
  name: mobilevit_s
  source: timm
  pretrained: true
  head: ce
  num_classes: 5
loss:
  name: cross_entropy
train:
  train_dataset: aptos
  epochs: 20
  batch_size: 4
  num_workers: 0
  optimizer: adamw
  learning_rate: 0.0001
  weight_decay: 0.0001
  scheduler: cosine
  amp: false
  selection_metric: quadratic_weighted_kappa
  interrupt_every: 20
  device: cpu
  freeze_bn: true
  max_steps_per_launch: 800
evaluate:
  datasets:
  - name: aptos_test
    dataset: aptos
    split: test
  - name: idrid_external
    dataset: idrid
    split: all
  - name: messidor2_external
    dataset: messidor2
    split: all
  - name: deepdrid_external
    dataset: deepdrid
    split: all
