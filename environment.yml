name: dr-research-exploratory
channels:
  - defaults
  - pytorch
dependencies:
  - python=3.13.2
  - pip
  - pip:
      - numpy==2.4.4
      - pandas==2.3.3
      - Pillow==11.2.1
      - opencv-python==4.12.0.88
      - PyYAML>=6.0
      - tqdm>=4.66
      - torch==2.7.1
      - torchvision==0.22.1
      - timm==1.0.29
      - scikit-learn==1.8.0
      - matplotlib==3.10.9
      - seaborn>=0.13
      - python-docx>=1.1
# NOTE: Exact CUDA/CPU/MPS wheels must match the host. Values above mirror paper/tables/environment.csv
# from the original Apple M2 training machine where possible.
